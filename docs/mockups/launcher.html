<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<title>Classic Games launcher (mockup, not built)</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: #05080f; padding: 24px; display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
  .wrap { flex: none; } .cap { font: 600 14px system-ui; color: #fff; margin: 0 0 8px 4px; }
  .frame { background: var(--bg); color: var(--ink); overflow: hidden; border: 1px solid var(--line); border-radius: 22px; font-family: var(--font); position: relative; }
  .phone { width: 390px; height: 844px; } .desk { width: 1180px; height: 700px; border-radius: 14px; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 6px 10px 6px 16px; border-bottom: 1px solid var(--line); }
  .wm { font-weight: 700; letter-spacing: .02em; } .wm span { font-weight: 400; color: var(--muted); margin-left: .25em; }
  .ics { display: flex; gap: 2px; } .ics i { width: 44px; height: 44px; display: grid; place-items: center; font-style: normal; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pad { padding: 16px; }
  h2 { margin: 0 0 4px; font-size: 1.5rem; } .sub { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
  .hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
  .hero canvas { width: 100%; display: block; border-radius: 12px; border: 2px solid var(--ink); background: var(--board); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .stat { font-size: .8rem; color: var(--muted); } .stat b { display: block; color: var(--ink); font-size: 1.1rem; }
  .play { height: 52px; padding: 0 28px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.1rem; display: inline-flex; align-items: center; gap: 8px; }
  .label { margin: 18px 2px 8px; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
  .card svg.art { width: 100%; height: 92px; display: block; background: var(--board); border-radius: 10px; }
  .card h3 { margin: 8px 2px 0; font-size: 1rem; } .card p { margin: 2px 2px 0; font-size: .75rem; color: var(--muted); }
  .soon { position: absolute; top: 16px; right: 16px; font-size: .625rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 3px 8px; }
  .daily { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 12px; }
  .daily b { display: block; } .daily small { color: var(--muted); }
  .daily .dot { width: 40px; height: 40px; border-radius: 12px; background: var(--board); display: grid; place-items: center; color: var(--bonus); }
  .list .it { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-bottom: 12px; }
  .list .it svg.art { width: 88px; height: 88px; border-radius: 14px; background: var(--board); flex: none; }
  .list .it h3 { margin: 0; font-size: 1.15rem; } .list .it p { margin: 2px 0 6px; color: var(--muted); font-size: .8rem; }
  .pill { display: inline-block; height: 36px; line-height: 36px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; }
  .pill.go { background: var(--accent); color: var(--accent-ink); } .pill.wait { background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .dmain { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; padding: 28px 36px; }
  .dside .it { margin-bottom: 14px; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 18px; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<script src="../../src/engine.js"></script>
<script src="../../src/render.js"></script>
<script>
(function () {
  var E = SnakeEngine, R = SnakeRender;
  var css = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
  var pal = function () { return { boardLine: css('--board-line'), snake: css('--snake'), snakeHead: css('--snake-head'), snakeEdge: css('--snake-edge'), shine: css('--shine'), eye: css('--eye'), pupil: css('--pupil'), food: css('--food'), bonus: css('--bonus'), obstacle: css('--obstacle'), obstacleEdge: css('--obstacle-edge') }; };
  var IC = {
    trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 13v4M9 20h6M10.5 17h3V20h-3z"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7"/><path d="M12 17h.01"/>',
    gear: '<circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
    play: '<path d="M8 5l11 7-11 7z" fill="currentColor"/>', cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'
  };
  var ic = function (n) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>'; };
  var top = '<div class="top"><div class="wm">Classic<span>Games</span></div><div class="ics"><i>' + ic('trophy') + '</i><i>' + ic('help') + '</i><i>' + ic('gear') + '</i></div></div>';
  // small illustrative art (not the real games)
  var ART = {
    bounce: '<svg class="art" viewBox="0 0 160 92"><rect x="14" y="68" width="48" height="10" rx="5" fill="' + '#6b84a3' + '"/><rect x="92" y="50" width="52" height="10" rx="5" fill="#6b84a3"/><circle cx="40" cy="50" r="13" fill="#ff6b5e"/><circle cx="36" cy="45" r="4" fill="#fff" opacity=".35"/><path d="M62 22q14-14 28 0" stroke="#34e39c" stroke-width="3" fill="none" stroke-dasharray="3 6" stroke-linecap="round"/></svg>',
    space: '<svg class="art" viewBox="0 0 160 92"><path d="M30 46l26-12v24z" fill="#34e39c"/><rect x="62" y="44" width="16" height="4" rx="2" fill="#ffd166"/><rect x="96" y="20" width="18" height="18" rx="4" fill="#a78bfa"/><rect x="118" y="54" width="18" height="18" rx="4" fill="#a78bfa"/><circle cx="130" cy="18" r="2" fill="#fff"/><circle cx="84" cy="76" r="2" fill="#fff"/><circle cx="20" cy="14" r="2" fill="#fff"/></svg>',
    snake: '<svg class="art" viewBox="0 0 160 92"><path d="M30 64h56v-24h40" stroke="#34e39c" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="40" r="9" fill="#7cf7c0"/><circle cx="131" cy="37" r="2" fill="#0a1a14"/><circle cx="131" cy="43" r="2" fill="#0a1a14"/><circle cx="52" cy="22" r="7" fill="#ff6b5e"/></svg>'
  };
  function el(cap, cls, html) { var w = document.createElement('div'); w.className = 'wrap'; w.innerHTML = '<div class="cap">' + cap + '</div><div class="frame ' + cls + '">' + html + '</div>'; document.body.appendChild(w); return w; }
  function thumb(host, w, h) {
    var g = E.createGame({ seed: 3, board: 'pillars' });
    var path = [[13,5],[12,5],[11,5],[10,5],[9,5],[8,5],[8,6],[8,7],[9,7],[10,7],[11,7],[12,7],[12,8],[12,9],[11,9],[10,9]];
    g = Object.assign({}, g, { snake: path.map(function (c) { return { x: c[0], y: c[1] }; }), dir: 'right', food: { x: 18, y: 6 } });
    var c = host.querySelector('canvas'); c.width = w * 2; c.height = h * 2; R.draw(c.getContext('2d'), g, pal(), c.width, c.height);
  }

  // A: shelf with a hero
  var a = el('A  Shelf: Snake up front, more games below', 'phone',
    top + '<div class="pad"><h2>Pick a game</h2><p class="sub">Classic games, rebuilt. No ads, no sign up.</p>' +
    '<div class="hero"><canvas></canvas><div class="row"><div><div class="stat">Best<b>42</b></div></div><div><div class="stat">Last played<b>Today</b></div></div><span class="play">' + ic('play') + ' Play</span></div></div>' +
    '<div class="daily"><span class="dot">' + ic('cal') + '</span><div><b>Daily challenge</b><small>Same maze and food for everyone. Not played yet.</small></div></div>' +
    '<div class="label">More games</div><div class="two">' +
    '<div class="card"><span class="soon">Soon</span>' + ART.bounce + '<h3>Bounce</h3><p>Roll, jump, collect</p></div>' +
    '<div class="card"><span class="soon">Soon</span>' + ART.space + '<h3>Space Impact</h3><p>Shoot your way through</p></div></div></div>');
  thumb(a, 340, 200);

  // B: arcade list
  el('B  Arcade list: one row per game', 'phone',
    top + '<div class="pad list"><h2>Classic Games</h2><p class="sub">Tap a game to play. Your best scores are saved on this device.</p>' +
    '<div class="it">' + ART.snake + '<div><h3>Snake</h3><p>Mazes, wrap, lives, bonus food</p><span class="pill go">Play</span> &nbsp;<small style="color:var(--muted)">Best 42</small></div></div>' +
    '<div class="it">' + ART.bounce + '<div><h3>Bounce</h3><p>Roll, jump, collect</p><span class="pill wait">Coming soon</span></div></div>' +
    '<div class="it">' + ART.space + '<div><h3>Space Impact</h3><p>Shoot your way through</p><span class="pill wait">Coming soon</span></div></div>' +
    '<div class="daily"><span class="dot">' + ic('cal') + '</span><div><b>Daily challenge</b><small>One shared run a day. Share your score.</small></div></div></div>');

  // Desktop
  var d = el('C  Desktop: hero on the left, list on the right', 'desk',
    top + '<div class="dmain"><div class="hero"><canvas></canvas><div class="row"><div><h2 style="margin:0">Snake</h2><div class="sub" style="margin:0">Mazes, wrap, lives, bonus food</div></div><div class="stat">Best<b>42</b></div><span class="play">' + ic('play') + ' Play</span></div></div>' +
    '<div class="dside list"><div class="label" style="margin-top:0">All games</div>' +
    '<div class="it">' + ART.bounce + '<div><h3>Bounce</h3><p>Roll, jump, collect</p><span class="pill wait">Coming soon</span></div></div>' +
    '<div class="it">' + ART.space + '<div><h3>Space Impact</h3><p>Shoot your way through</p><span class="pill wait">Coming soon</span></div></div>' +
    '<div class="daily"><span class="dot">' + ic('cal') + '</span><div><b>Daily challenge</b><small>Same maze and food for everyone. Share your score.</small></div></div></div></div>' +
    '<div class="foot"><span>Classic Games. An early version. Gameplay may differ from the originals.</span><span>Themes: Colour, LCD, Night</span></div>');
  thumb(d, 600, 400);
  document.title = 'ready';
})();
</script>
</body>
</html>
