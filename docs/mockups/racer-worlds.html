<!doctype html><html><head><meta charset="utf-8"><title>Racer worlds</title>
<style>
body{margin:0;background:#1d2330;color:#eaf1ff;font-family:system-ui,Segoe UI,Roboto,sans-serif;padding:26px;width:1180px}
h1{font-size:22px;margin:0 0 4px}p.sub{margin:0 0 18px;color:#9fb0cc;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(5,220px);gap:14px}
.sc{width:220px}.sc .v{width:220px;height:420px;border-radius:18px;overflow:hidden;position:relative;border:2px solid #0006}
.sc .t{font-size:13px;font-weight:700;margin-top:6px}.sc .d{font-size:11px;color:#9fb0cc}
.sec{font-weight:700;margin:22px 0 8px;font-size:15px}
.cars{display:flex;gap:16px;background:#2b3345;border-radius:16px;padding:14px;align-items:flex-end;width:1130px}
.cars div{text-align:center;font-size:11px;color:#cfe}
.strip{display:flex;gap:6px;margin:6px 0 14px;width:1130px}.strip span{flex:1;background:#2b3345;border-radius:10px;padding:8px 4px;text-align:center;font-size:11px}.strip b{display:block;font-size:14px}
</style></head><body>
<h1>Racer: one mode, 3 lanes, ten changing scenes (mock)</h1><p class="sub">The scene changes as your distance grows. Weather and sound change with it. Cars are modern but simple and a bit classic.</p>
<div class="strip" id="st"></div>
<div class="grid" id="g"></div>
<div class="sec">Traffic and your car (modern shapes, flat colours, soft light)</div>
<div class="cars" id="cars"></div>
<script>
const W=220,H=420,L=[88,110,132].map((x,i)=>[70,110,150][i]);
function car(x,y,col,k,o={}){
  const t={hatch:{w:34,h:60,r:11,cab:[.30,.50]},sedan:{w:34,h:68,r:11,cab:[.34,.46]},suv:{w:38,h:70,r:10,cab:[.28,.58]},sport:{w:36,h:66,r:15,cab:[.40,.34]},van:{w:38,h:74,r:8,cab:[.16,.66]},truck:{w:40,h:112,r:7,cab:[.06,.2]},taxi:{w:34,h:66,r:10,cab:[.34,.46]},bus:{w:42,h:130,r:8,cab:[.05,.8]}}[k];
  const w=t.w,h=t.h;let s=`<g ${o.rot?`transform="rotate(${o.rot} ${x} ${y})"`:''}>`;
  s+=`<ellipse cx="${x}" cy="${y+h/2}" rx="${w/2+4}" ry="6" fill="#000" opacity=".28"/>`;
  [[-1,.18],[1,.18],[-1,.74],[1,.74]].forEach(([sx,f])=>s+=`<rect x="${x+sx*(w/2)-(sx<0?3:2)}" y="${y-h/2+h*f}" width="5" height="${k==='bus'||k==='truck'?14:15}" rx="2" fill="#0d0f14"/>`);
  if(k==='truck'){s+=`<rect x="${x-w/2}" y="${y-h/2+34}" width="${w}" height="${h-34}" rx="3" fill="#d9dde6"/><rect x="${x-w/2+3}" y="${y-h/2+38}" width="${w-6}" height="${h-44}" rx="2" fill="#bfc6d4"/><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="34" rx="8" fill="${col}"/><rect x="${x-w/2+4}" y="${y-h/2+5}" width="${w-8}" height="10" rx="3" fill="#18202e"/>`;}
  else {s+=`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${t.r}" fill="${col}"/>`;
  s+=`<rect x="${x-w/2+4}" y="${y-h/2+h*t.cab[0]}" width="${w-8}" height="${h*t.cab[1]}" rx="${k==='bus'?3:7}" fill="#16202e"/>`;
  if(k==='bus') for(let i=0;i<5;i++) s+=`<rect x="${x-w/2+6}" y="${y-h/2+16+i*20}" width="${w-12}" height="14" rx="2" fill="#2a3a52"/>`;
  else s+=`<rect x="${x-w/2+6}" y="${y-h/2+h*t.cab[0]+3}" width="${w-12}" height="${h*t.cab[1]*0.34}" rx="4" fill="#2c3d57"/>`;
  s+=`<rect x="${x-w/2+4}" y="${y-h/2+3}" width="${w-8}" height="${h*0.22}" rx="8" fill="#fff" opacity=".14"/>`;
  if(k==='taxi') s+=`<rect x="${x-6}" y="${y-4}" width="12" height="6" rx="2" fill="#fff6a8"/>`;
  if(k==='sport') s+=`<rect x="${x-3}" y="${y-h/2}" width="6" height="${h}" fill="#fff" opacity=".22"/>`;}
  // lights
  if(o.head) s+=`<rect x="${x-w/2+3}" y="${y-h/2+1}" width="9" height="4" rx="2" fill="#fff8cf"/><rect x="${x+w/2-12}" y="${y-h/2+1}" width="9" height="4" rx="2" fill="#fff8cf"/>`;
  else s+=`<rect x="${x-w/2+3}" y="${y+h/2-5}" width="9" height="4" rx="2" fill="#ff4d4d"/><rect x="${x+w/2-12}" y="${y+h/2-5}" width="9" height="4" rx="2" fill="#ff4d4d"/>`;
  return s+'</g>';
}
// each scene: sky/ground colours, roadside draw, overlay
const rnd=(i,a)=>((i*9301+49297+a*233)%233280)/233280;
const tree=(x,y,c,r=11)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x-3}" cy="${y-3}" r="${r*.45}" fill="#fff" opacity=".1"/>`;
const pine=(x,y,c,snow)=>`<polygon points="${x},${y-18} ${x+11},${y+8} ${x-11},${y+8}" fill="${c}"/>${snow?`<polygon points="${x},${y-18} ${x+6},${y-4} ${x-6},${y-4}" fill="#fff"/>`:''}`;
const cactus=(x,y)=>`<rect x="${x-3}" y="${y-14}" width="6" height="26" rx="3" fill="#4d8a52"/><rect x="${x-10}" y="${y-8}" width="5" height="12" rx="2" fill="#4d8a52"/><rect x="${x+5}" y="${y-4}" width="5" height="10" rx="2" fill="#4d8a52"/>`;
const palm=(x,y)=>`<rect x="${x-2}" y="${y-4}" width="4" height="22" fill="#8a6a3c"/>${[0,60,120,180,240,300].map(a=>`<ellipse cx="${x+Math.cos(a*Math.PI/180)*9}" cy="${y-6+Math.sin(a*Math.PI/180)*5}" rx="9" ry="3" fill="#2f9e6a" transform="rotate(${a} ${x+Math.cos(a*Math.PI/180)*9} ${y-6+Math.sin(a*Math.PI/180)*5})"/>`).join('')}`;
const bld=(x,y,w,h,c,lit)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`+(lit?Array.from({length:Math.floor(h/12)},(_,i)=>`<rect x="${x+4}" y="${y+4+i*12}" width="${w-8}" height="4" fill="${lit}" opacity=".7"/>`).join(''):'');
const rock=(x,y,c)=>`<ellipse cx="${x}" cy="${y}" rx="12" ry="7" fill="${c}"/>`;
const post=(x,y,c)=>`<rect x="${x}" y="${y}" width="3" height="22" fill="#555"/><circle cx="${x+1.5}" cy="${y}" r="4" fill="${c}"/>`;
const scenes=[
 {n:'1  Countryside',d:'Day · 0 m',g:'#86b86a',a:'#4b5563',e:'#e5e1d3',l:'#f5f1e6',dec:(s)=>{for(let i=0;i<9;i++){s.push(tree(24,i*52+10,'#4c8a4c'),tree(198,i*52+36,'#5a9a56'))}},sky:null,veh:['hatch','sedan','taxi']},
 {n:'2  City',d:'Day · 300 m',g:'#9aa3b0',a:'#454c58',e:'#c9ced8',l:'#f1f1f1',dec:(s)=>{for(let i=0;i<5;i++){s.push(bld(2,i*84+6,38,72,['#6b7a90','#8896ab','#5a6a82'][i%3],'#cfe3ff'),bld(180,i*84+36,38,72,['#7a8aa0','#586a85','#8a98ad'][i%3],'#cfe3ff'))}},sky:null,veh:['taxi','bus','suv']},
 {n:'3  Desert',d:'Midday · 700 m',g:'#e0b878',a:'#6b5b52',e:'#d6c3a0',l:'#fff1c8',dec:(s)=>{for(let i=0;i<6;i++){s.push(i%2?cactus(30,i*70+30):rock(26,i*70+30,'#b58a5a'),i%2?rock(196,i*70+60,'#b58a5a'):cactus(194,i*70+60))}},sky:'heat',veh:['suv','hatch','truck']},
 {n:'4  Coast sunset',d:'Sunset · 1,200 m',g:'#e7c28b',a:'#4a4f63',e:'#f3dcc0',l:'#fff3d6',dec:(s)=>{s.push(`<rect x="170" y="0" width="50" height="420" fill="#2d7fb8"/><rect x="176" y="0" width="44" height="420" fill="#3b95cf" opacity=".6"/>`);for(let i=0;i<6;i++)s.push(palm(26,i*74+24))},sky:'sunset',veh:['sport','suv','sedan']},
 {n:'5  Autumn forest',d:'Day · 1,800 m',g:'#6b8f4e',a:'#4a4a52',e:'#d9d2c0',l:'#f6efe0',dec:(s)=>{for(let i=0;i<9;i++){s.push(tree(24,i*50+16,['#d9822b','#c2410c','#e6a73a'][i%3],12),tree(198,i*50+40,['#e6a73a','#d9822b','#b45309'][i%3],12))}},sky:'leaves',veh:['hatch','suv','van']},
 {n:'6  Mountain fog',d:'Fog · 2,500 m',g:'#6d8a78',a:'#4f5662',e:'#cbd3d0',l:'#eef2ee',dec:(s)=>{for(let i=0;i<8;i++){s.push(pine(24,i*56+16,'#2f5a45'),pine(198,i*56+44,'#376a50'))}},sky:'fog',veh:['sedan','truck','hatch']},
 {n:'7  Rain highway',d:'Storm · 3,200 m',g:'#4b6252',a:'#2e333e',e:'#7d8798',l:'#b9c4d6',dec:(s)=>{for(let i=0;i<8;i++){s.push(post(30,i*58+10,'#ffd166'),tree(196,i*58+40,'#2c4a37',10))}},sky:'rain',veh:['suv','van','sedan']},
 {n:'8  Snow',d:'Snowfall · 4,000 m',g:'#e4ecf3',a:'#59606c',e:'#ffffff',l:'#ffffff',dec:(s)=>{for(let i=0;i<8;i++){s.push(pine(24,i*56+20,'#2b5b4a',1),pine(198,i*56+46,'#2b5b4a',1))}},sky:'snow',veh:['suv','truck','hatch']},
 {n:'9  Neon city night',d:'Night · 5,000 m',g:'#141a2e',a:'#1a1f33',e:'#3a4570',l:'#7fe3ff',dec:(s)=>{for(let i=0;i<5;i++){s.push(bld(2,i*84+6,38,72,'#222a48','#ff4fd8'),bld(180,i*84+36,38,72,'#222a48','#35e6ff'))}},sky:'neon',veh:['sport','taxi','sedan'],night:1},
 {n:'10  Night tunnel',d:'Night · 6,500 m',g:'#0a0d16',a:'#161b26',e:'#2a3348',l:'#ffb347',dec:(s)=>{for(let i=0;i<9;i++){s.push(`<rect x="0" y="${i*48}" width="34" height="3" fill="#ffb347" opacity=".8"/><rect x="186" y="${i*48+20}" width="34" height="3" fill="#ffb347" opacity=".8"/>`)}},sky:'tunnel',veh:['van','sport','suv'],night:1}
];
const cols=['#e11d48','#2563eb','#f59e0b','#7c3aed','#10b981','#ef4444','#06b6d4','#f97316'];
function scene(sc,idx){
  let s=`<rect width="${W}" height="${H}" fill="${sc.g}"/>`;
  const dec=[];sc.dec(dec);s+=dec.join('');
  s+=`<rect x="46" y="0" width="128" height="${H}" fill="${sc.a}"/><rect x="46" y="0" width="3" height="${H}" fill="${sc.e}"/><rect x="171" y="0" width="3" height="${H}" fill="${sc.e}"/>`;
  for(let i=0;i<8;i++){const y=i*60-10;s+=`<rect x="88" y="${y}" width="3" height="30" rx="1.5" fill="${sc.l}"/><rect x="129" y="${y}" width="3" height="30" rx="1.5" fill="${sc.l}"/>`}
  const [a,b,c]=sc.veh;
  s+=car(70,110,cols[(idx+1)%8],a,{});s+=car(150,215,cols[(idx+3)%8],b,{});s+=car(110,40,cols[(idx+5)%8],c,{});
  s+=car(110,350,'#ffffff',['hatch','sport','sport','sedan'][idx%4],{head:1});
  if(sc.night) s+=`<defs><linearGradient id="hl${idx}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff8cf" stop-opacity=".5"/><stop offset="1" stop-color="#fff8cf" stop-opacity="0"/></linearGradient></defs><polygon points="94,325 126,325 150,150 70,150" fill="url(#hl${idx})"/>`;
  // overlays
  const o=sc.sky;
  if(o==='sunset') s+=`<rect width="${W}" height="${H}" fill="#ff8a3d" opacity=".22"/><rect width="${W}" height="140" fill="url(#sun)"/><defs><linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5f6d" stop-opacity=".45"/><stop offset="1" stop-color="#ff5f6d" stop-opacity="0"/></linearGradient></defs>`;
  if(o==='heat') s+=`<rect width="${W}" height="${H}" fill="#ffd27a" opacity=".12"/>`+Array.from({length:6},(_,i)=>`<path d="M0 ${60+i*60} q55 -8 110 0 t110 0" stroke="#fff" stroke-opacity=".18" stroke-width="2" fill="none"/>`).join('');
  if(o==='fog') s+=`<rect width="${W}" height="${H}" fill="#e9eef0" opacity=".42"/><rect width="${W}" height="150" fill="#fff" opacity=".25"/>`;
  if(o==='rain') s+=`<rect width="${W}" height="${H}" fill="#1b2433" opacity=".3"/>`+Array.from({length:70},(_,i)=>{const x=rnd(i,1)*W,y=rnd(i,2)*H;return `<line x1="${x}" y1="${y}" x2="${x-4}" y2="${y+16}" stroke="#cfe3ff" stroke-opacity=".5" stroke-width="1.3"/>`}).join('')+`<ellipse cx="110" cy="250" rx="30" ry="9" fill="#cfe3ff" opacity=".18"/>`;
  if(o==='snow') s+=`<rect width="${W}" height="${H}" fill="#e8f1ff" opacity=".18"/>`+Array.from({length:60},(_,i)=>`<circle cx="${rnd(i,3)*W}" cy="${rnd(i,4)*H}" r="${1.2+rnd(i,5)*2}" fill="#fff"/>`).join('');
  if(o==='leaves') s+=Array.from({length:14},(_,i)=>`<ellipse cx="${rnd(i,6)*W}" cy="${rnd(i,7)*H}" rx="5" ry="3" fill="${['#e6a73a','#c2410c','#d9822b'][i%3]}" transform="rotate(${rnd(i,8)*180} ${rnd(i,6)*W} ${rnd(i,7)*H})"/>`).join('');
  if(o==='neon') s+=`<rect width="${W}" height="${H}" fill="#0a0420" opacity=".25"/><rect x="0" y="0" width="46" height="${H}" fill="#ff4fd8" opacity=".08"/><rect x="174" y="0" width="46" height="${H}" fill="#35e6ff" opacity=".08"/>`;
  if(o==='tunnel') s+=`<rect width="${W}" height="${H}" fill="#000" opacity=".18"/>`;
  if(o!=='fog'&&o!=='rain'&&o!=='snow'&&o!=='tunnel') s+=`<rect width="${W}" height="${H}" fill="#000" opacity="0"/>`;
  s+=`<g font-family="system-ui" font-weight="700"><rect x="40" y="10" width="140" height="26" rx="13" fill="#0007"/><text x="110" y="28" font-size="12" fill="#fff" text-anchor="middle">${sc.n.replace(/^\d+\s+/,'')}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;
}
document.getElementById('g').innerHTML=scenes.map((sc,i)=>`<div class="sc"><div class="v">${scene(sc,i)}</div><div class="t">${sc.n}</div><div class="d">${sc.d}</div></div>`).join('');
document.getElementById('st').innerHTML=scenes.map(sc=>`<span><b>${sc.d.split('· ')[1]}</b>${sc.n.replace(/^\d+\s+/,'')}</span>`).join('');
const lineup=[['hatch','#2563eb','You'],['sport','#f43f5e','Sports'],['sedan','#10b981','Sedan'],['suv','#f59e0b','SUV'],['van','#a78bfa','Van'],['taxi','#fde047','Taxi'],['truck','#e11d48','Truck'],['bus','#06b6d4','Bus']];
document.getElementById('cars').innerHTML=lineup.map(([k,c,n],i)=>`<div><svg viewBox="0 0 70 ${k==='bus'?150:k==='truck'?130:90}" width="70" height="${k==='bus'?150:k==='truck'?130:90}">${car(35,k==='bus'?72:k==='truck'?62:44,c,k,{head:i===0})}</svg><br>${n}</div>`).join('');
</script></body></html>
